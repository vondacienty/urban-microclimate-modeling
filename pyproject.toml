[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-microclimate-modeling"
version = "0.1.0"
description = "Urban microclimate and heat island modelling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
urban-microclimate-modeling = "urban_micro.cli:main"

[tool.setuptools]
packages = ["urban_micro"]
